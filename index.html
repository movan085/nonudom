<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสารสนเทศเพื่อการประชาสัมพันธ์ - อบต.โนนอุดม</title>
    
    <link rel="icon" type="image/png" href="./IMG_0350.png">
    <link rel="apple-touch-icon" href="./IMG_0350.png">
    <meta name="theme-color" content="#0071BA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PR Studio">

    <!-- CSS/JS ไลบรารี -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ไลบรารีแคปรูปที่เสถียรที่สุดเรื่อง Layout -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    
    <!-- Flatpickr สำหรับแก้ปัญหาวันที่/เวลา -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
    
    <!-- ฝังฟอนต์ Kanit ด้วย Bunny Fonts -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=kanit:400,700" rel="stylesheet" />
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .img-placeholder { width: 100%; height: 100%; background-color: #e2e8f0; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .shape-t3-purple { background-color: #6a5996; }
        .shape-t3-lightpurple { background-color: #a8a0c2; }
        
        /* บังคับขนาดเทมเพลตเพื่อกันแคปเพี้ยน */
        #template-3 { width: 800px !important; height: 1131px !important; min-width: 800px !important; min-height: 1131px !important; max-width: 800px !important; max-height: 1131px !important; }
        #preview-wrapper { width: 100%; display: flex; justify-content: center; transform-origin: top center; overflow: hidden; }
        #preview-scaler { transform-origin: top center; }

        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden text-gray-800">
    
    <!-- Toast Notification -->
    <div id="toast-message" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg z-[70] flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none -translate-y-10">
        <span>✅</span> <span id="toast-text" class="font-medium">แจ้งเตือน!</span>
    </div>

    <!-- Pop-up ยืนยันจองรถ -->
    <div id="booking-confirm-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-gray-900/50 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 md:p-8 transform scale-95 transition-transform duration-300 flex flex-col shadow-2xl" id="booking-confirm-content">
            <div class="flex justify-between items-center mb-5 border-b border-gray-200 pb-4">
                <h3 class="text-xl font-bold text-blue-900 flex items-center gap-2"><span>📋</span> ยืนยันข้อมูลการจอง</h3>
                <button onclick="window.closeBookingConfirm()" class="text-gray-400 hover:text-gray-700 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition">✕</button>
            </div>
            
            <div class="space-y-3 mb-8 text-sm">
                <div class="flex flex-col bg-gray-50 p-4 rounded-2xl border border-gray-200">
                    <span class="text-gray-500 font-bold mb-1 text-xs uppercase tracking-wider">🚘 รถที่เลือก</span>
                    <span id="confirm-detail-car" class="font-bold text-gray-800 text-base"></span>
                </div>
                <div class="flex flex-col bg-gray-50 p-4 rounded-2xl border border-gray-200">
                    <span class="text-gray-500 font-bold mb-1 text-xs uppercase tracking-wider">👤 ผู้ขอใช้ / สถานที่</span>
                    <span id="confirm-detail-name" class="font-bold text-blue-600 text-base"></span>
                    <span id="confirm-detail-dest" class="text-gray-700 mt-1 font-medium"></span>
                </div>
                <div class="flex flex-col bg-blue-50 border border-blue-200 p-4 rounded-2xl">
                    <span class="text-blue-700 font-bold mb-1 text-xs uppercase tracking-wider">📅 วันและเวลา</span>
                    <span id="confirm-detail-datetime" class="font-bold text-blue-900 text-base"></span>
                </div>
                <div id="confirm-detail-notify" class="flex items-center gap-2 p-3.5 rounded-2xl font-bold border"></div>
            </div>
            
            <div class="flex gap-3 w-full">
                <button onclick="window.closeBookingConfirm()" class="flex-1 px-4 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition">แก้ไข</button>
                <button onclick="window.executeSaveBooking()" id="btn-final-confirm" class="flex-[1.5] px-4 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-md flex justify-center items-center gap-2">ยืนยัน 🚀</button>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Modal (ลบข้อมูล) -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-gray-900/50 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 transform scale-95 transition-transform duration-300 flex flex-col" id="confirm-modal-content">
            <div class="flex justify-center mb-4 text-5xl">⚠️</div>
            <h3 class="text-xl font-bold text-gray-800 text-center mb-2" id="confirm-title">ยืนยันการดำเนินการ</h3>
            <p class="text-gray-600 text-center mb-6 font-medium" id="confirm-message">คุณแน่ใจหรือไม่ที่จะดำเนินการนี้?</p>
            <div class="flex justify-center gap-3 w-full">
                <button id="btn-confirm-cancel" class="flex-1 px-4 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition">ยกเลิก</button>
                <button id="btn-confirm-ok" class="flex-1 px-4 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl transition shadow-md">ยืนยัน</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW: DASHBOARD (หน้าแรก) -->
    <!-- ========================================== -->
    <div id="view-dashboard" class="flex flex-col items-center justify-start p-4 md:p-8 flex-1 fade-in w-full max-w-[1200px] mx-auto z-10">
        <div class="w-full bg-white rounded-[2.5rem] overflow-hidden shadow-xl border border-gray-100">
            <div class="relative p-8 md:p-12 text-center border-b border-blue-100 bg-blue-50">
                <div class="relative z-10 flex flex-col items-center">
                    <div class="w-24 h-24 bg-white rounded-full p-1.5 shadow-md border border-gray-100 mb-5">
                        <img src="./IMG_0350.png" class="agency-logo-img w-full h-full rounded-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/200x200/0071BA/FFF?text=Logo'"/>
                    </div>
                    <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-2 tracking-tight">ฝ่ายประชาสัมพันธ์ <span class="text-blue-600">-</span> อบต.โนนอุดม</h1>
                    <p class="text-gray-600 text-sm md:text-base font-medium px-5 py-2 bg-white rounded-full inline-block border border-gray-200 mt-2">ระบบสารสนเทศเพื่อการสร้างสื่อและจัดการทรัพยากร</p>
                </div>
            </div>

            <div class="p-6 md:p-10 bg-white">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-10 max-w-4xl mx-auto">
                    <button onclick="window.switchView('view-newsletter')" class="group text-left bg-white hover:bg-gray-50 border border-gray-200 rounded-[2rem] p-6 md:p-8 relative overflow-hidden flex flex-col h-full shadow-sm transition">
                        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-3xl mb-5 group-hover:scale-110 transition-transform duration-300">📰</div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">จดหมายข่าว</h3>
                        <p class="text-sm font-medium text-gray-500">สร้างภาพข่าวประชาสัมพันธ์สำหรับหน่วยงาน</p>
                    </button>
                    <button onclick="window.switchView('view-vehicle')" class="group text-left bg-white hover:bg-gray-50 border border-gray-200 rounded-[2rem] p-6 md:p-8 relative overflow-hidden flex flex-col h-full shadow-sm transition">
                        <div class="absolute top-5 right-5 bg-yellow-100 border border-yellow-200 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full animate-pulse">เพิ่มคิวจองรถ</div>
                        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-3xl mb-5 group-hover:scale-110 transition-transform duration-300">🚙</div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">ระบบจองรถส่วนกลาง</h3>
                        <p class="text-sm font-medium text-gray-500">บันทึกคิวการใช้งานและแจ้งเตือนเข้ากลุ่ม LINE</p>
                    </button>
                </div>

                <div class="w-full mt-6">
                    <div class="flex items-center justify-between mb-5 px-2 border-l-4 border-blue-500 pl-4">
                        <h2 class="text-xl md:text-2xl font-bold text-gray-800 flex items-center gap-3">
                            กระดานคิวรถส่วนกลาง <span class="text-sm font-normal text-gray-500 bg-gray-100 px-3 py-1 rounded-full hidden md:inline-block">15 วันล่าสุด</span>
                        </h2>
                        <span id="dash-cloud-status" class="text-xs font-bold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span> ตรวจสอบสถานะ...</span>
                    </div>
                    <div id="dashboard-timeline" class="w-full bg-gray-50 rounded-[2rem] border border-gray-200 overflow-hidden max-h-[500px] overflow-y-auto custom-scroll p-3 md:p-6"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW: VEHICLE BOOKING -->
    <!-- ========================================== -->
    <div id="view-vehicle" class="hidden max-w-[1400px] mx-auto w-full p-4 md:p-8 flex flex-col gap-6 fade-in relative z-10">
        <div class="flex items-center justify-between bg-white p-4 rounded-[1.5rem] border border-gray-200 shadow-sm">
            <button onclick="window.switchView('view-dashboard')" class="flex items-center gap-2 text-blue-600 font-bold hover:bg-blue-50 px-4 py-2 rounded-xl transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
                กลับหน้าหลัก
            </button>
            <h2 class="font-bold text-gray-800 md:text-lg pr-2">🚙 จัดการและจองรถส่วนกลาง</h2>
        </div>

        <div class="flex flex
