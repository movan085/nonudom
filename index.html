<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สร้างจดหมายข่าว</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Kanit', sans-serif; background: #f2f2f7; color: #1c1c1e; padding: 16px 16px 60px; }
h1 { font-size: 20px; margin-bottom: 12px; }
.card { background: #fff; border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
label { display: block; font-size: 13px; color: #636366; margin: 12px 0 6px; font-weight: 600; }
label:first-child { margin-top: 0; }
input, textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid #e5e5ea; background: #f9f9fb; }
textarea { min-height: 120px; resize: vertical; }

.photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot { aspect-ratio: 1; border: 1.5px dashed #c7c7cc; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; background: #f9f9fb; font-size: 12px; color: #8e8e93; text-align: center; }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot input { display: none; }
.slot.cover { grid-column: span 2; grid-row: span 2; }

.btn { width: 100%; padding: 16px; border: 0; border-radius: 14px; font: inherit; font-weight: 600; font-size: 17px; background: #007aff; color: #fff; margin-top: 4px; }
.btn:disabled { opacity: .5; }

#previewWrap { width: 100%; overflow: hidden; display: flex; justify-content: center; border-radius: 12px; background: #e5e5ea; }
#previewBox { width: 800px; flex-shrink: 0; transform-origin: top center; }

/* ===== แม่แบบจดหมายข่าว (กว้าง 800px ตายตัว ไม่ถูกย่อตอนเซฟ) ===== */
#paper { width: 800px; background: #faf8f3; font-family: 'Kanit', sans-serif; color: #2b2540; padding-bottom: 44px; }
#paper .org-band { background: #6a5996; color: #fff; padding: 28px 56px 22px; }
#paper .org { font-size: 24px; font-weight: 600; line-height: 1.8; }
#paper .hero { width: 100%; height: 400px; object-fit: cover; display: block; background: #d9d4e8; }
#paper .title-band { background: #a8a0c2; padding: 22px 56px; }
#paper .title { font-size: 42px; font-weight: 700; color: #fff; line-height: 1.7; }
#paper .meta { display: flex; justify-content: space-between; align-items: center; padding: 22px 56px 0; font-size: 22px; font-weight: 600; color: #6a5996; line-height: 1.8; }
#paper .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 22px 56px 0; }
#paper .grid img { width: 100%; height: 170px; object-fit: cover; border-radius: 12px; display: block; background: #e5e5ea; }
#paper .body { padding: 28px 56px 0; font-size: 24px; line-height: 2; white-space: pre-wrap; text-align: left; }
#paper .foot { margin: 32px 56px 0; background: #6a5996; color: #fff; border-radius: 999px; padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: 600; line-height: 1.8; }
</style>
</head>
<body>

<h1>📰 สร้างจดหมายข่าว</h1>

<div class="card">
  <label>1. เลือกรูป (ช่องใหญ่คือรูปปก ที่เหลือเป็นรูปกิจกรรม สูงสุด 7 รูป)</label>
  <div class="photos" id="photos"></div>
</div>

<div class="card">
  <label>ชื่อหน่วยงาน</label>
  <input id="inOrg" value="องค์การบริหารส่วนตำบลโนนอุดม">
  <label>หัวข้อข่าว</label>
  <input id="inTitle" placeholder="เช่น ประชุมประจำเดือนตำบลโนนอุดม">
  <label>วันที่</label>
  <input id="inDate" placeholder="เช่น วันพุธที่ 14 ตุลาคม 2569">
  <label>เนื้อหา</label>
  <textarea id="inBody" placeholder="พิมพ์เนื้อหาข่าวที่นี่ (กด Enter เพื่อขึ้นบรรทัดใหม่ได้)"></textarea>
  <label>เบอร์ติดต่อ / ท้ายเอกสาร</label>
  <input id="inPhone" placeholder="เช่น โทร.044-077070">
</div>

<div class="card">
  <label>ตัวอย่าง</label>
  <div id="previewWrap"><div id="previewBox">
    <div id="paper">
      <div class="org-band"><div class="org" data-f="org"></div></div>
      <img class="hero" id="hero" alt="">
      <div class="title-band"><div class="title" data-f="title"></div></div>
      <div class="meta"><div data-f="date"></div></div>
      <div class="grid" id="grid"></div>
      <div class="body" data-f="body"></div>
      <div class="foot"><div data-f="phone"></div><div data-f="org2"></div></div>
    </div>
  </div></div>
</div>

<button class="btn" id="saveBtn">💾 บันทึกเป็นรูปภาพ</button>

<script>
const MAX_PHOTOS = 7;
const photos = new Array(MAX_PHOTOS).fill(null);
const $ = (s, el = document) => el.querySelector(s);
const paper = $('#paper');

// ---------- ช่องอัปโหลดรูป ----------
const photosBox = $('#photos');
for (let i = 0; i < MAX_PHOTOS; i++) {
  const slot = document.createElement('label');
  slot.className = 'slot' + (i === 0 ? ' cover' : '');
  slot.innerHTML = `<span>${i === 0 ? 'รูปปก' : '+ รูปที่ ' + (i + 1)}</span>
    <input type="file" accept="image/*">`;
  photosBox.appendChild(slot);

  slot.querySelector('input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    photos[i] = await compress(file);
    let img = slot.querySelector('img');
    if (!img) { img = document.createElement('img'); slot.appendChild(img); }
    img.src = photos[i];
    slot.querySelector('span').style.display = 'none';
    render();
  });
}

// ย่อรูปก่อนใช้ เพื่อให้มือถือไม่หน่วงและไฟล์ PNG ไม่ใหญ่เกินไป
function compress(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r);
      c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.9));
    };
    img.onerror = reject;
    img.src = url;
  });
}

// ---------- ผูกข้อความกับแม่แบบ ----------
const inputs = { org: '#inOrg', title: '#inTitle', date: '#inDate', body: '#inBody', phone: '#inPhone' };
const placeholders = { org: 'ชื่อหน่วยงาน', title: 'หัวข้อข่าว', date: 'วันที่', body: 'เนื้อหาข่าว', phone: 'เบอร์ติดต่อ' };

async function render() {
  const hero = $('#hero');
  hero.src = photos[0] || '';
  hero.style.display = photos[0] ? 'block' : 'none';

  $('#grid').innerHTML = photos.slice(1).filter(Boolean).map(s => `<img src="${s}" alt="">`).join('');
  $('#grid').style.display = photos.slice(1).some(Boolean) ? 'grid' : 'none';

  const v = {};
  for (const k in inputs) v[k] = $(inputs[k]).value.trim() || placeholders[k];
  paper.querySelector('[data-f="org"]').textContent = v.org;
  paper.querySelector('[data-f="org2"]').textContent = v.org;
  paper.querySelector('[data-f="title"]').textContent = v.title;
  paper.querySelector('[data-f="date"]').textContent = v.date;
  paper.querySelector('[data-f="body"]').textContent = v.body;
  paper.querySelector('[data-f="phone"]').textContent = v.phone;

  // รอให้รูปโหลดเสร็จก่อนคำนวณขนาดพรีวิวใหม่
  await Promise.all([...paper.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : null));
  fit();
}

for (const k in inputs) $(inputs[k]).addEventListener('input', render);

// ---------- ย่อหน้าจอพรีวิวให้พอดีมือถือ (แค่ตอนแสดงผล ไม่กระทบตอนเซฟ) ----------
function fit() {
  const wrap = $('#previewWrap');
  const box = $('#previewBox');
  const s = Math.min(1, (wrap.clientWidth - 16) / 800);
  box.style.transform = `scale(${s})`;
  wrap.style.height = (paper.offsetHeight * s) + 'px';
}
window.addEventListener('resize', fit);

// ---------- บันทึกเป็นรูป ----------
$('#saveBtn').addEventListener('click', async () => {
  const btn = $('#saveBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังสร้างรูป...';
  try {
    await document.fonts.ready;

    // โคลนแม่แบบไปวางนอกจอแบบไม่ย่อ แล้วถ่ายภาพจากตัวนี้
    const holder = document.createElement('div');
    holder.style.cssText = 'position:absolute;left:-10000px;top:0;width:800px;';
    const clone = paper.cloneNode(true);
    holder.appendChild(clone);
    document.body.appendChild(holder);

    await Promise.all([...clone.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : null));

    const canvas = await html2canvas(clone, {
      scale: 2,
      backgroundColor: '#faf8f3',
      width: 800,
      windowWidth: 800,
      useCORS: true
    });
    holder.remove();

    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const file = new File([blob], 'newsletter.png', { type: 'image/png' });

    // บนมือถือ: เปิดหน้าแชร์ของระบบ แล้วเลือก "บันทึกรูปภาพ" เพื่อเก็บลงอัลบั้ม
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'จดหมายข่าว' });
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }

    // บนคอมหรือเบราว์เซอร์ที่ไม่รองรับการแชร์: ดาวน์โหลดตรง ๆ
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (err) {
    alert('สร้างรูปไม่สำเร็จ ลองลดจำนวนรูปหรือรีเฟรชหน้าใหม่อีกครั้ง');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 บันทึกเป็นรูปภาพ';
  }
});

render();
</script>
</body>
</html>
